# One card per project on /work/. Fields: title, when, where, problem, methods (list), outcome, link (optional).
- title: "Benchmarking AI Tools for Mutation-Aware PIK3CA Recognition"
  when: "2025–2026"
  where: "Master's thesis · CSIR-IGIB"
  problem: "Can co-folding, docking and affinity models tell how a clinical mutation in PIK3CA changes how an inhibitor binds, and find the pocket it binds in?"
  methods: [Boltz-2, Protenix, DiffDock-L, FlowDock, GNINA, GatorAffinity, CheapNet, PoseBusters]
  outcome: "300-pair benchmark (15 variants × 20 ligands). Rescoring on Boltz-2 poses ranks affinity well (ρ = 0.85), but every tool puts the allosteric inhibitors in the ATP pocket, about 20 Å from where they bind. Guidance fixes pose geometry, not placement."
  link: /projects/pik3ca-benchmark/

- title: "G-quadruplex biophysics with telomeric DNA and TERRA RNA"
  when: "2025"
  where: "CSIR-IGIB, Biophysics Lab"
  problem: "Characterise G-quadruplex structures and how they interact with telomeric DNA (TELO) and TERRA RNA."
  methods: [EMSA, Gel permeation chromatography, BCA assay]
  outcome: "Biophysical characterisation of G-quadruplex binding with TELO DNA and TERRA RNA."

- title: "RNA-binding domains of Nucleolin"
  when: "2024"
  where: "CSIR-IGIB, Biophysics Lab"
  problem: "How do Nucleolin's RNA-binding domains recognise RNA?"
  methods: [Structural bioinformatics, RNA–protein docking]
  outcome: "Structural bioinformatics analysis and RNA–protein docking of the RNA-binding domains."

- title: "Virtual screening for Huntington's disease"
  when: "2023"
  where: "Amity Institute of Biotechnology"
  problem: "Find plant-derived compounds that act on Huntington's disease pathways."
  methods: [RNA-seq differential expression, STRING-DB, Cytoscape, LigPrep, AutoDock, PyMOL]
  outcome: "Screened 150+ phytochemicals and identified 3 potential drug candidates. Presented at APB-2024 (2nd place)."
