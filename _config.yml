# Site settings
title: "Nabajit Borah"
description: "Computational biologist working at the intersection of AI and protein structure."
author:
  name: "Nabajit Borah"
  twitter: "TensorTwerker"
url: "https://nabajitb.github.io"
baseurl: ""
lang: en_US

# Social links (also read by jekyll-seo-tag)
github: "nabajitb"
google_scholar: "Nabajit Borah"
linkedin: "nabajit"
twitter:
  username: "TensorTwerker"
  card: summary_large_image
medium: "@nabbo"
# Home-page Reading list: the latest Bluesky posts carrying #tag (read in the browser from Bluesky's public API).
bluesky:
  handle: "nabajitb.bsky.social"
  tag: "reading"
social:
  name: "Nabajit Borah"
  links:
    - https://github.com/nabajitb
    - https://www.linkedin.com/in/nabajit/
    - https://x.com/TensorTwerker
    - https://medium.com/@nabbo
    - https://scholar.google.com/citations?user=YEooiOMAAAAJ
    - https://bsky.app/profile/nabajitb.bsky.social

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:title/
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

# Blog collection
collections:
  blogs:
    output: true
    permalink: /blogs/:name/

feed:
  collections:
    - blogs

defaults:
  - scope:
      path: ""
    values:
      image: /assets/og.png   # link-card preview (jekyll-seo-tag)
  - scope:
      path: ""
      type: blogs
    values:
      layout: blog_post

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor/
  - scripts/

# Navigation ("Writing" is hidden until there is at least one published post)
navigation:
  - title: Home
    url: /
  - title: Work
    url: /work/
  - title: Publications
    url: /publications/
  - title: Writing
    url: /blogs/
